spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://docker-mysql:3307/foodie_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:foodie}
    password: ${DB_PASSWORD:foodie}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
