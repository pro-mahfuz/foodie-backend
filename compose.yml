name: foodie-backend

services:

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    image: foodie-eureka-server:${IMAGE_TAG:-latest}
    container_name: foodie-eureka-server

    ports:
      - "8761:8761"

    environment:
      EUREKA_HOSTNAME: eureka-server

    restart: unless-stopped


  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: foodie-config-server:${IMAGE_TAG:-latest}
    container_name: foodie-config-server

    ports:
      - "8888:8888"

    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/

    depends_on:
      eureka-server:
        condition: service_started

    restart: on-failure


  user-db:
    image: mysql:8.4
    container_name: foodie-user-db

    environment:
      MYSQL_DATABASE: user_db
      MYSQL_USER: foodie
      MYSQL_PASSWORD: foodie
      MYSQL_ROOT_PASSWORD: root-foodie

    volumes:
      - user-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - localhost
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped


  food-db:
    image: mysql:8.4
    container_name: foodie-food-db

    environment:
      MYSQL_DATABASE: food_db
      MYSQL_USER: foodie
      MYSQL_PASSWORD: foodie
      MYSQL_ROOT_PASSWORD: root-foodie

    volumes:
      - food-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - localhost
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped


  order-db:
    image: mysql:8.4
    container_name: foodie-order-db

    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: foodie
      MYSQL_PASSWORD: foodie
      MYSQL_ROOT_PASSWORD: root-foodie

    volumes:
      - order-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - "-h"
        - localhost
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped


  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: foodie-user-service:${IMAGE_TAG:-latest}
    container_name: foodie-user-service

    expose:
      - "8081"

    environment:
      DB_URL: jdbc:mysql://user-db:3306/user_db?serverTimezone=UTC
      DB_USER: foodie
      DB_PASSWORD: foodie
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/

    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_started

    restart: on-failure


  food-service:
    build:
      context: .
      dockerfile: food-service/Dockerfile
    image: foodie-food-service:${IMAGE_TAG:-latest}
    container_name: foodie-food-service

    expose:
      - "8082"

    environment:
      DB_URL: jdbc:mysql://food-db:3306/food_db?serverTimezone=UTC
      DB_USER: foodie
      DB_PASSWORD: foodie
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/

    depends_on:
      food-db:
        condition: service_healthy
      config-server:
        condition: service_started

    restart: on-failure


  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: foodie-order-service:${IMAGE_TAG:-latest}
    container_name: foodie-order-service

    expose:
      - "8083"

    environment:
      DB_URL: jdbc:mysql://order-db:3306/order_db?serverTimezone=UTC
      DB_USER: foodie
      DB_PASSWORD: foodie
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/

    depends_on:
      order-db:
        condition: service_healthy
      config-server:
        condition: service_started
      user-service:
        condition: service_started
      food-service:
        condition: service_started

    restart: on-failure


  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: foodie-api-gateway:${IMAGE_TAG:-latest}
    container_name: foodie-api-gateway

    ports:
      - "8084:8084"

    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/

    depends_on:
      config-server:
        condition: service_started
      user-service:
        condition: service_started
      food-service:
        condition: service_started
      order-service:
        condition: service_started

    restart: on-failure


volumes:
  user-data:
  food-data:
  order-data: