services:
  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: foodie_db
      MYSQL_USER: foodie
      MYSQL_PASSWORD: foodie
      MYSQL_ROOT_PASSWORD: root-foodie
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodie_db?serverTimezone=UTC
      DB_USER: foodie
      DB_PASSWORD: foodie
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
